<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedBus Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>RedBus Clone</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Bus Tickets</a>
      <a href="#">Help</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <section id="search">
    <h2>Book Bus Tickets</h2>
    <form>
      <input type="text" placeholder="From" required />
      <input type="text" placeholder="To" required />
      <input type="date" required />
      <button type="submit">Search Buses</button>
    </form>
  </section>

  <section id="buses">
    <h2>Available Buses</h2>
    <!-- Results populate dynamically here -->
  </section>

  <footer>
    <p>© 2025 RedBus Clone | Built with HTML, CSS & JS</p>
  </footer>
<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
<df-messenger
  intent="WELCOME"
  chat-title="trip_planner"
  agent-id="66f213dc-49ce-48d9-9657-60b5a0094c96"
  language-code="en"
></df-messenger>

</body>
</html>
